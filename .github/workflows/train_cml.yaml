name: model-training

on:
  pull_request:
    branches: [ "main" ] # Ajout des crochets pour la bonne syntaxe YAML

permissions: write-all

jobs:
  train_and_report_eval_performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      # Setup CML GitHub Action
      - name: Setup CML
        uses: iterative/setup-cml@v1 # <-- Rempli : Action officielle pour installer CML
          
      - name: Train model
        run: |
          python3 preprocess_dataset.py
          python3 train.py

      - name: Write CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Add metrics data to markdown
          cat metrics.json >> model_eval_report.md # <-- Rempli : Fichier contenant vos métriques
          
          # Add confusion matrix plot to markdown
          echo "![confusion matrix plot](./confusion_matrix.png)" >> model_eval_report.md # <-- Rempli : Nom de votre graphique

          # Create comment from markdown report
          cml comment create model_eval_report.md # <-- Rempli : Commande CML pour publier le rapport
